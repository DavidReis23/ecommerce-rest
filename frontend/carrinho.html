<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Carrinho</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f5f5f5;
        }
    </style>
</head>
<body class="bg-gray-100">
    <header class="bg-blue-600 p-4 shadow-md">
        <div class="container mx-auto flex items-center justify-between">
            <a href="index.html" class="text-white text-2xl font-bold">DRL PureStyle</a>
            <a href="index.html" class="flex items-center text-white text-lg hover:underline transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                </svg>
                Continuar Comprando
            </a>
        </div>
    </header>

    <main class="container mx-auto p-6">
        <h2 class="text-3xl font-bold text-gray-800 mb-6">Meu Carrinho</h2>
        
        <div id="carrinho-itens-container" class="bg-white rounded-lg shadow-md p-6 mb-6">
            <!-- Itens do carrinho serão carregados aqui pelo JS -->
        </div>

        <div id="carrinho-resumo" class="bg-white rounded-lg shadow-md p-6 flex flex-col items-end">
            <h3 class="text-2xl font-bold text-gray-800 mb-2">Total: <span id="carrinho-total">R$ 0.00</span></h3>
            <button id="finalizar-compra-btn" class="bg-green-500 text-white font-bold py-3 px-6 rounded-lg hover:bg-green-600 transition-colors">
                Finalizar Compra
            </button>
        </div>
    </main>

    <script src="carrinho.js"></script>
</body>
</html>
