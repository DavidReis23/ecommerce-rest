<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Loja - Adicionar Produto</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-100">
    <header class="bg-blue-600 p-4 shadow-md text-center">
        <h1 class="text-white text-2xl font-bold">Adicionar Novo Produto</h1>
    </header>

    <main class="container mx-auto p-6">
        <div class="form-container max-w-lg mx-auto p-8 bg-white rounded-xl shadow-2xl">
            <h2 class="text-2xl font-bold text-gray-800 mb-6 text-center">Cadastro de Produto</h2>
            <form id="add-produto-form">
                <input type="text" id="nome-produto" placeholder="Nome do Produto" required 
                       class="w-full p-3 mb-4 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500">
                
                <textarea id="descricao-produto" placeholder="Descrição do Produto" rows="3"
                          class="w-full p-3 mb-4 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500"></textarea>
                
                <input type="number" id="preco-produto" placeholder="Preço (ex: 99.90)" step="0.01" required
                       class="w-full p-3 mb-4 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500">
                
                <!-- NOVO CAMPO: ESTOQUE -->
                <input type="number" id="estoque-produto" placeholder="Quantidade em Estoque" required
                       class="w-full p-3 mb-4 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500">
                
                <input type="text" id="categoria-produto" placeholder="Categoria (ex: Camisa, Tenis)"
                       class="w-full p-3 mb-4 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500">
                
                <input type="text" id="imagem-url-produto" placeholder="URL da Imagem"
                       class="w-full p-3 mb-6 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500">
                
                <button type="submit"
                        class="w-full py-3 bg-blue-600 text-white font-bold rounded-lg shadow-md hover:bg-blue-700 transition-colors">
                    Adicionar Produto
                </button>
            </form>
        </div>
    </main>

    <script src="admin.js"></script>
</body>
</html>
