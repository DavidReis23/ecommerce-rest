<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Loja Online</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f5f5f5;
        }
    </style>
</head>
<body class="bg-gray-100">
    <!-- Barra de Navegação -->
    <header class="bg-blue-600 p-4 shadow-md">
        <div class="container mx-auto flex items-center justify-between">
            <a href="index.html" class="text-white text-2xl font-bold">Minha Loja Online</a>
            <a href="carrinho.html" class="flex items-center text-white text-lg hover:underline transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l1.6-7H6.5a1 1 0 00-.9.59L3.72 17.29A2 2 0 004 20h14a2 2 0 002-2V7a2 2 0 00-2-2H8l-1.38-5.5a1 1 0 00-.99-.5H3a1 1 0 00-1 1v12a1 1 0 001 1h16a1 1 0 001-1V7a1 1 0 00-1-1h-6.5a1 1 0 00-.99-.5z" />
                </svg>
                Carrinho
            </a>
        </div>
    </header>

    <main class="container mx-auto p-6">
        <!-- Filtros de Categoria -->
        <div class="flex flex-wrap gap-4 mb-8 justify-center">
            <button class="filter-btn bg-white text-gray-800 font-semibold py-2 px-4 rounded-full shadow-md hover:bg-gray-200 transition-colors" data-categoria="Todos">Todos</button>
            <button class="filter-btn bg-white text-gray-800 font-semibold py-2 px-4 rounded-full shadow-md hover:bg-gray-200 transition-colors" data-categoria="Camisa">Camisas</button>
            <button class="filter-btn bg-white text-gray-800 font-semibold py-2 px-4 rounded-full shadow-md hover:bg-gray-200 transition-colors" data-categoria="Tenis">Tênis</button>
            <button class="filter-btn bg-white text-gray-800 font-semibold py-2 px-4 rounded-full shadow-md hover:bg-gray-200 transition-colors" data-categoria="Promocao">Promoções</button>
            <button class="filter-btn bg-white text-gray-800 font-semibold py-2 px-4 rounded-full shadow-md hover:bg-gray-200 transition-colors" data-categoria="Acessorios">Acessórios</button>
        </div>

        <h2 class="text-2xl font-bold text-gray-800 mb-6">Nossos Produtos</h2>
        <div id="produtos-container" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
            <!-- Os produtos serão carregados aqui pelo JavaScript -->
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
